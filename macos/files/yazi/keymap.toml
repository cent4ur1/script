[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents"
desc = "Go to ~/Documents"

[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = "cd /Users/macintosh/Documents/uni"
desc = "Go to uni folder"

[[mgr.prepend_keymap]]
on   = [ "g", "l" ]
run  = 'cd "/Users/macintosh/Library/Application Support"'
desc = "Go to Application Support"
