# ~/.config/kitty/kitty.conf
# Translated from alacritty.toml

# --- env / term ---
# Kitty normally sets TERM to xterm-kitty. Force xterm-256color to match Alacritty.
term xterm-256color

# --- window ---
window_padding_width 0

# Alacritty's decorations = "Buttonless" (title bar, no buttons) is a macOS-specific
# style with no exact Linux equivalent in kitty. Closest options:
#   hide_window_decorations no            -> normal title bar + buttons (default)
#   hide_window_decorations yes           -> no title bar at all
#   hide_window_decorations titlebar-only -> title bar, no buttons (macOS only)
hide_window_decorations titlebar-only

background_opacity 0.7

# Alacritty's blur = false. Background blur in kitty is macOS-only and off by default;
# explicitly disabling it here for parity.
background_blur 0

# --- scrolling ---
scrollback_lines 100000

# --- font ---
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 18

# --- hints / URL handling ---
# Kitty doesn't take a custom regex for link-hinting like Alacritty's [[hints.enabled]].
# It has built-in hyperlink (OSC 8) detection plus a URL-prefix allowlist, and opens
# links with the OS opener (xdg-open on Linux) by default — matching command = "xdg-open".
url_prefixes http https ftp file mailto git ssh gemini gopher news ipfs ipns magnet
detect_urls yes
# Underline urls on hover, click (or ctrl+click, depending on mouse_map) to open:
show_hyperlink_targets no
# To require a modifier click instead of plain click, uncomment and adjust:
# mouse_map ctrl+left click ungrabbed mouse_click_url

# --- colors ---
background #000000
foreground #ffffff

cursor      #008b94
cursor_text_color #fafafa

# Normal colors
color0  #333f4a
color1  #d95468
color2  #8bd49c
color3  #ebbf83
color4  #539afc
color5  #b62d65
color6  #70e1e8
color7  #b7c5d3

# Bright colors (commented out in the source alacritty.toml; left as-is/defaults here)
# color8  #41505e
# color9  #d95468
# color10 #8bd49c
# color11 #ebbf83
# color12 #5ec4ff
# color13 #e27e8d
# color14 #70e1e8
# color15 #ffffff

# --- keyboard ---
# Alacritty: Shift+Return sends ESC + CR
map shift+enter send_text all \x1b\r
